services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: whatsapp_business
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U whatsapp -d whatsapp_business']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: node:24.18.0-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run prisma:generate --workspace @whatsapp-business/api && npm run start --workspace @whatsapp-business/api"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://whatsapp:whatsapp@postgres:5432/whatsapp_business?schema=public
      CORS_ORIGIN: http://localhost:5173
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/workspace
      - api-node-modules:/workspace/node_modules

  worker:
    image: node:24.18.0-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run start --workspace @whatsapp-business/worker"
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - .:/workspace
      - worker-node-modules:/workspace/node_modules

  web:
    image: node:24.18.0-alpine
    working_dir: /workspace
    command: sh -c "npm ci && npm run dev --workspace @whatsapp-business/web"
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - '5173:5173'
    depends_on:
      - api
    volumes:
      - .:/workspace
      - web-node-modules:/workspace/node_modules

volumes:
  postgres-data:
  api-node-modules:
  worker-node-modules:
  web-node-modules:
